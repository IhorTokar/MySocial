spring:
  # Секрети беруться зі змінних оточення або з файлу .env у корені проєкту (він не потрапляє в git).
  # Шаблон з усіма потрібними змінними — .env.example.
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  application:
    name: social-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/social_network}
    username: ${DB_USERNAME:social_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate     # схему створює ТІЛЬКИ Flyway, Hibernate лише перевіряє
    # SQL-запити в консоль: SHOW_SQL=true у .env — лише для налагодження
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}          # щонайменше 32 символи
  expiration-ms: 86400000

# Захист від підбору пароля: після стількох невдалих спроб вхід блокується до кінця вікна
security:
  login:
    max-failures-per-user: 5     # для одного логіна
    max-failures-per-ip: 30      # з однієї IP-адреси (на будь-які логіни)
    lockout-minutes: 15

neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  username: ${NEO4J_USERNAME:neo4j}
  password: ${NEO4J_PASSWORD}

nlp-service:
  base-url: http://localhost:8001

# Детальні журнали для налагодження вмикаються без зміни коду — змінною оточення під час запуску:
#   LOGGING_LEVEL_COM_EXAMPLE_SOCIAL_SERVER_SERVICE=DEBUG mvn -pl server spring-boot:run
# За замовчуванням DEBUG вимкнено: EmbeddingApiService на цьому рівні пише в журнал тексти постів.
app:
  upload:
    dir: uploads

recommendation:
  weights:
    popularity: 0.10
    item-cf: 0.35
    graph-sim: 0.35
    semantic: 0.10
    recency: 0.10
    followed-bonus: 0.3
  # MMR-різноманітність стрічки: 1.0 — вимкнено (чисте ранжування за формулою 3.1),
  # 0.7–0.8 — помітно різноманітніша стрічка без великої втрати релевантності.
  # Як і weights, діє лише поки в БД немає жодної версії ваг; далі λ змінюється в адмін-панелі.
  mmr:
    lambda: 0.7


# Автоматичні знімки історії ехо-камер (Louvain і Leiden). Spring cron: сек хв год день міс день_тижня.
# "-" — вимкнено. Знімок, що нічим не відрізняється від попереднього, не зберігається.
echo-history:
  cron: "0 0 */6 * * *"

# Плановий перерахунок векторів node2vec (синхронізація графа підписок + node2vec).
# За замовчуванням — щоночі о 03:30; "-" — вимкнено (тоді лише вручну з адмін-панелі).
graph-embeddings:
  cron: "0 30 3 * * *"
  dimension: 16
