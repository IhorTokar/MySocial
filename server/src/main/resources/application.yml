spring:
  application:
    name: social-server

  datasource:
    url: jdbc:postgresql://localhost:5432/social_network
    username: social_app
    password: frogchairuwu9AB
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate     # схему створює ТІЛЬКИ Flyway, Hibernate лише перевіряє
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-in-prod}
  expiration-ms: 86400000   # 24 години