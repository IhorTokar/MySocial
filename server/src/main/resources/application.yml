spring:
  application:
    name: social-server

  datasource:
    url: jdbc:postgresql://localhost:5432/social_network
    username: social_app
    password: frogchairuwu9AB
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate     # схему створює ТІЛЬКИ Flyway, Hibernate лише перевіряє
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

jwt:
