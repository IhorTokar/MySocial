spring:
  # Секрети беруться зі змінних оточення або з файлу .env у корені проєкту (він не потрапляє в git).
  # Шаблон з усіма потрібними змінними — .env.example.
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  application:
    name: social-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/social_network}
    username: ${DB_USERNAME:social_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate     # схему створює ТІЛЬКИ Flyway, Hibernate лише перевіряє
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}          # щонайменше 32 символи
  expiration-ms: 86400000

neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  username: ${NEO4J_USERNAME:neo4j}
  password: ${NEO4J_PASSWORD}

nlp-service:
  base-url: http://localhost:8001

logging:
  level:
    com.example.social.server.service.RecommendationService: DEBUG
    com.example.social.server.service.EmbeddingApiService: DEBUG
app:
  upload:
    dir: uploads

recommendation:
  weights:
    popularity: 0.10
    item-cf: 0.35
    graph-sim: 0.35
    semantic: 0.10
    recency: 0.10
    followed-bonus: 0.3