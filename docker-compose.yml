services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: social-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: social_network
      POSTGRES_USER: ${DB_USERNAME:-social_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Вкажіть DB_PASSWORD у файлі .env}
    ports:
      - "5432:5432"
    volumes:
      - social-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: social-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Вкажіть PGADMIN_PASSWORD у файлі .env}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - social-pgadmin-data:/var/lib/pgadmin

  neo4j:
    image: neo4j:5.23-community
    container_name: social-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Вкажіть NEO4J_PASSWORD у файлі .env}
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4JLABS_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - social-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nlp:
    build:
      context: ./nlp-service
    container_name: social-nlp
    restart: unless-stopped
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  social-pg-data:
  social-pgadmin-data:
  social-neo4j-data: